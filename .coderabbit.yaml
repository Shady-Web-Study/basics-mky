# basics-mky 전용 CodeRabbit 설정 (HTML · CSS · JS 과제 레포)
# 위치: 이 레포 루트. 리뷰는 PR의 작업 브랜치에 있는 설정 파일을 읽으므로,
#       기본 브랜치(develop)에 먼저 커밋한 뒤 작업 브랜치를 따 주세요.
 
language: ko-KR
 
# 최대 250자
tone_instructions: >-
  리뷰 대상은 HTML·CSS·JS를 배우는 스터디원이에요. 친절한 존댓말로 무엇이 왜 문제인지
  관련 개념 키워드와 함께 설명하고, 고칠 곳에는 바로 적용할 수 있는 수정 코드 제안을
  함께 달아 주세요.
 
reviews:
  # quiet / chill / assertive — 입문 단계라 잔소리가 덜한 chill
  profile: chill
 
  # 승인·라벨·리뷰어 지정은 사람이
  auto_approvals:
    enabled: false
  suggested_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
 
  # 요약은 유지, 장식은 끄기
  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
 
  auto_review:
    enabled: true
    auto_incremental_review: true   # 리뷰 반영 커밋을 푸시하면 다시 봐줌
    drafts: false                   # Draft PR은 리뷰하지 않음
    base_branches:                  # 기본 브랜치(develop) 외에 main으로 가는 PR도 리뷰
      - "^main$"
    ignore_title_keywords :
      - "WIP"
      - "[skip review]"
 
  # 리뷰할 필요 없는 파일 제외
  path_filters:
    - "!**/*.svg"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.webp"
 
  # 폴더가 아니라 파일 종류로만 지정 → 폴더 구조가 어떻든 적용
  path_instructions:
    - path: "**/*.html"
      instructions: |
        - div 남용 대신 header, nav, main, section, article, footer 같은 시맨틱 태그를 적절히 썼는지 봐 주세요.
        - 제목 태그(h1~h6) 순서, img의 alt, label과 input 연결, button의 type 속성을 확인해 주세요.
        - 인라인 style·onclick 대신 CSS·JS 파일로 분리했는지 봐 주세요.
    - path: "**/*.css"
      instructions: |
        - Flexbox·Grid로 해결할 수 있는 정렬을 margin이나 position으로 억지로 맞췄는지 봐 주세요.
        - 고정 px 남용으로 반응형이 깨지는 부분, 미디어 쿼리 사용, 중복 선언과 불필요한 !important를 짚어 주세요.
        - 클래스 이름이 역할을 잘 드러내는지(예: BEM) 가볍게 봐 주세요.
    - path: "**/*.js"
      instructions: |
        - var 대신 const·let, == 대신 ===를 쓰는지 확인해 주세요.
        - DOM 요소를 반복해서 찾는지, 이벤트 리스너가 중복 등록되는지, innerHTML에 사용자 입력을 그대로 넣는지 봐 주세요.
        - 함수가 한 가지 일만 하는지, 이름이 동작을 잘 설명하는지 봐 주세요.
 
  finishing_touches:
    autofix:
      enabled: true        # 리뷰 코멘트의 수정 제안을 체크박스·명령으로 바로 적용
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
 
  tools:
    htmlhint:
      enabled: true
    stylelint:
      enabled: true
    eslint:
      enabled: true
    gitleaks:
      enabled: true
 
chat:
  auto_reply: true         # 리뷰 댓글에 답하면 멘션 없이도 대답
  art: false

knowledge_base:
  # 웹 검색을 통해 최신 기술 정보 참고
  web_search:
    enabled: true